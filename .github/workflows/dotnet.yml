name: .NET Build and Test

on:
  push:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: YourStrong!Password123
        ports:
          - 1433:1433
        options: >-
          --name=ecommerce-sql-test
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong!Password123 -Q 'SELECT 1' -C"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore
      run: dotnet restore
      working-directory: ./EcommerceAPI
    
    - name: Build
      run: dotnet build --no-restore
      working-directory: ./EcommerceAPI
    
    - name: Unit Tests
      run: dotnet test --filter "UnitTests" --no-build
      working-directory: ./EcommerceAPI
    
    - name: Integration Tests
      run: dotnet test --filter "IntegrationTests" --no-build
      working-directory: ./EcommerceAPI
      env:
        ConnectionStrings__DefaultConnection: "Server=localhost;Database=EcommerceDB;User Id=sa;Password=YourStrong!Password123;TrustServerCertificate=True;"