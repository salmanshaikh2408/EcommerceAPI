name: .NET Build and Test

on:
  push:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: 12345
        ports:
          - 1433:1433
        options: >-
          --name=ecommerce-sql-test
          --health-cmd="sqlcmd -S localhost -U sa -P 12345 -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./EcommerceAPI
    
    - name: Build
      run: dotnet build --no-restore
      working-directory: ./EcommerceAPI
    
    - name: Run Unit Tests
      run: dotnet test --filter "FullyQualifiedName~UnitTests" --no-build --verbosity normal
      working-directory: ./EcommerceAPI
    
    - name: Run Integration Tests
      run: dotnet test --filter "FullyQualifiedName~IntegrationTests" --no-build --verbosity normal
      working-directory: ./EcommerceAPI
      env:
        ConnectionStrings__DefaultConnection: "Server=localhost;Database=EcommerceDB;User Id=sa;Password=12345;TrustServerCertificate=True;"